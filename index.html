<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Catch - w15 Game</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 16px; color: #cbd5e1; }
    .hud {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      margin-bottom: 12px;
      font-weight: bold;
    }
    canvas {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    button {
      margin-top: 14px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <h1>Speed Catch</h1>
  <p>Move Left / Right using <strong>Arrow Keys</strong> or <strong>A / D</strong> to catch falling stars!</p>
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <canvas id="game" width="420" height="480"></canvas>
  <button id="restartBtn">Restart Game</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const restartBtn = document.getElementById("restartBtn");

    let player, stars, keys, score, lives, gameOver, spawnTimer, animId;

    function initGame() {
      player = { x: canvas.width / 2 - 35, y: canvas.height - 32, w: 70, h: 16, speed: 6 };
      stars = [];
      keys = {};
      score = 0;
      lives = 3;
      gameOver = false;
      spawnTimer = 0;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      cancelAnimationFrame(animId);
      loop();
    }

    window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
    restartBtn.addEventListener("click", initGame);

    function spawnStar() {
      stars.push({
        x: Math.random() * (canvas.width - 24) + 12,
        y: -15,
        r: 10,
        speed: 2.5 + Math.min(score * 0.12, 4.5)
      });
    }

    function update() {
      if (gameOver) return;

      if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
      if (keys["arrowright"] || keys["d"]) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      spawnTimer++;
      if (spawnTimer > 38) {
        spawnStar();
        spawnTimer = 0;
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.y += s.speed;

        const hitPlayer =
          s.y + s.r >= player.y &&
          s.y - s.r <= player.y + player.h &&
          s.x + s.r >= player.x &&
          s.x - s.r <= player.x + player.w;

        if (hitPlayer) {
          score++;
          scoreEl.textContent = score;
          stars.splice(i, 1);
        } else if (s.y - s.r > canvas.height) {
          stars.splice(i, 1);
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0) {
            gameOver = true;
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player paddle
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Falling stars
      for (const s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "#facc15";
        ctx.fill();
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 28px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = "18px system-ui";
        ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 22);
      }
    }

    function loop() {
      update();
      draw();
      animId = requestAnimationFrame(loop);
    }

    initGame();
  </script>
</body>
</html>
